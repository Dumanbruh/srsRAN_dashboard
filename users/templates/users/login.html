<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KazNU 5G Project — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b12;--panel:#0d1220;--border:rgba(55,138,221,0.2);
  --blue:#378ADD;--blue2:#1a4a7a;--green:#1D9E75;
  --text:#c8d4e8;--text2:#556070;--red:#E24B4A;
  --glow:0 0 20px rgba(55,138,221,0.15);
}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(55,138,221,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(29,158,117,0.04) 0%, transparent 50%);
}
.grid-bg{position:fixed;inset:0;background-image:
  linear-gradient(rgba(55,138,221,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(55,138,221,0.03) 1px, transparent 1px);
  background-size:40px 40px;pointer-events:none;}
.panel{
  position:relative;width:380px;background:var(--panel);
  border:1px solid var(--border);border-radius:4px;padding:2.5rem;
  box-shadow:var(--glow), inset 0 1px 0 rgba(55,138,221,0.1);
}
.panel::before{content:'';position:absolute;top:0;left:2rem;right:2rem;height:1px;
  background:linear-gradient(90deg,transparent,var(--blue),transparent);}
.logo{text-align:center;margin-bottom:2rem;}
.logo-main{font-family:'Share Tech Mono',monospace;font-size:26px;letter-spacing:0.15em;color:var(--text);}
.logo-main span{color:var(--blue);}
.logo-sub{font-size:11px;color:var(--text2);letter-spacing:0.3em;text-transform:uppercase;margin-top:6px;}
.field{margin-bottom:1.2rem;}
label{display:block;font-size:11px;color:var(--text2);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:6px;}
input{
  width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(55,138,221,0.2);
  border-radius:3px;padding:10px 14px;color:var(--text);font-family:'Exo 2',sans-serif;
  font-size:14px;outline:none;transition:border-color 0.2s, box-shadow 0.2s;
}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(55,138,221,0.08);}
.btn{
  width:100%;padding:11px;background:linear-gradient(135deg,var(--blue2),var(--blue));
  border:none;border-radius:3px;color:#fff;font-family:'Exo 2',sans-serif;
  font-size:14px;font-weight:600;letter-spacing:0.08em;cursor:pointer;
  transition:opacity 0.2s,transform 0.1s;margin-top:0.5rem;
}
.btn:hover{opacity:0.9;}
.btn:active{transform:scale(0.99);}
.error{background:rgba(226,75,74,0.1);border:1px solid rgba(226,75,74,0.3);
  border-radius:3px;padding:10px 14px;font-size:12px;color:var(--red);margin-bottom:1rem;}
.corner{position:absolute;width:10px;height:10px;border-color:var(--blue);border-style:solid;}
.corner.tl{top:8px;left:8px;border-width:1px 0 0 1px;}
.corner.tr{top:8px;right:8px;border-width:1px 1px 0 0;}
.corner.bl{bottom:8px;left:8px;border-width:0 0 1px 1px;}
.corner.br{bottom:8px;right:8px;border-width:0 1px 1px 0;}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="panel">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="logo">
    <div class="logo-main">Kaz<span>NU</span></div>
    <div class="logo-sub">Al-Farabi 5G Project</div>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Логин</label>
      <input type="text" name="username" autofocus autocomplete="username">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" name="password" autocomplete="current-password">
    </div>
    <button class="btn" type="submit">Войти</button>
  </form>
</div>
</body>
</html>
