version: '3.8'

services:
  web:
    build: .
    container_name: srsran_dashboard
    environment:
      - DJANGO_SETTINGS_MODULE=proja.settings
    env_file:
      - .env
    network_mode: host
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.3.14
    container_name: srsran_ollama
    network_mode: host
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
