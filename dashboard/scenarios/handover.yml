slug: handover
name: "Handover-эксперимент"
description: >
  Эмуляция перемещения UE1 относительно gNB через плавное изменение pathloss
  (приближение/удаление), несколько циклов подряд — для записи временных
  рядов под последующее обучение/проверку gradient-boosted trees предсказания
  handover. Реального многосотового handover на стенде нет (один gNB) —
  "handover" здесь means резкое изменение качества канала, а не смену соты.
  Фоновая DL-нагрузка идёт параллельно с ramp: без активного трафика CQI/MCS
  на этом стенде не пересчитываются (проверено на реальном прогоне) — без
  нагрузки в данных не будет сигнала, полезного для GBT-модели. Нагрузка —
  реальный iperf3-клиент внутри netns UE (testbed_root_ops.sh iperf_client),
  проверено на реальном прогоне 17.08.2026.

parameters:
  n_ue:
    type: int
    default: 1
    min: 1
    max: 7
    label: "Число UE"
  cycles:
    type: int
    default: 3
    min: 1
    max: 20
    label: "Число циклов приближение/удаление"
  pathloss_near_db:
    type: float
    default: 0
    min: 0
    max: 100
    label: "Pathloss «рядом с БС», дБ"
  pathloss_far_db:
    type: float
    default: 80
    min: 0
    max: 100
    label: "Pathloss «на краю покрытия», дБ"
  ramp_duration_s:
    type: int
    default: 15
    min: 2
    max: 300
    label: "Длительность одного перехода, с"
  hold_s:
    type: int
    default: 10
    min: 0
    max: 300
    label: "Пауза в каждой точке (near/far), с"
  background_load_mbps:
    type: float
    default: 5
    min: 0
    max: 100
    label: "Фоновая DL-нагрузка на UE1, Мбит/с (0 = без нагрузки)"
  load_duration_s:
    type: int
    default: 300
    min: 10
    max: 1800
    label: "Верхняя граница длительности фоновой нагрузки, с (с запасом на весь прогон)"

steps:
  - type: component_start
    component: gnuradio
    params: {n: "{{n_ue}}"}
  - type: wait_ready
    component: gnuradio
    timeout_s: 40

  - type: component_start
    component: gnb
  - type: wait_ready
    component: gnb
    timeout_s: 30

  - type: component_start
    component: ue
    params: {n: "{{n_ue}}"}
  - type: wait_ready
    component: ue
    n: "{{n_ue}}"
    timeout_s: 40
    timeout_s_per_ue: 20

  - type: component_start
    component: bridge

  - type: set_pathloss
    ue_id: 1
    value: "{{pathloss_near_db}}"

  - type: load_dl
    background: true
    ue_ids: [1]
    bitrate_mbps: "{{background_load_mbps}}"
    duration_s: "{{load_duration_s}}"

  - type: snapshot_metrics
    label: "baseline near"

  - type: repeat
    count: "{{cycles}}"
    steps:
      - type: ramp_pathloss
        ue_id: 1
        from: "{{pathloss_near_db}}"
        to: "{{pathloss_far_db}}"
        duration_s: "{{ramp_duration_s}}"
        steps: 20
      - type: snapshot_metrics
        label: "far"
      - type: sleep
        duration_s: "{{hold_s}}"
      - type: ramp_pathloss
        ue_id: 1
        from: "{{pathloss_far_db}}"
        to: "{{pathloss_near_db}}"
        duration_s: "{{ramp_duration_s}}"
        steps: 20
      - type: snapshot_metrics
        label: "near"
      - type: sleep
        duration_s: "{{hold_s}}"

  - type: component_stop
    component: bridge
  - type: component_stop
    component: ue
  - type: component_stop
    component: gnb
  - type: component_stop
    component: gnuradio
