slug: ppo_slicing
name: "PPO SLA-slicing"
description: >
  Несколько активных срезов eMBB/URLLC/mMTC с профилем нагрузки — для
  сравнения политик распределения PRB. ВНИМАНИЕ: на этом стенде нет
  готового механизма реального PRB-слайсинга (FlexRIC-xApp для slicing
  отсутствует) — шаг apply_slice_profile сейчас ТОЛЬКО параметризуется и
  пишется в лог/RunLog, не управляет планировщиком gNB. Остальная часть
  сценария (подъём сети, метрики, DL-нагрузка через iperf3-клиент внутри
  netns UE) — реальная. Проверено на реальном прогоне 17.08.2026.

parameters:
  n_ue:
    type: int
    default: 2
    min: 1
    max: 7
    label: "Число UE (по одному на срез, если возможно)"
  embb_prb_pct:
    type: float
    default: 50
    min: 0
    max: 100
    label: "eMBB — целевая доля PRB, %"
  urllc_prb_pct:
    type: float
    default: 30
    min: 0
    max: 100
    label: "URLLC — целевая доля PRB, %"
  mmtc_prb_pct:
    type: float
    default: 20
    min: 0
    max: 100
    label: "mMTC — целевая доля PRB, %"
  embb_bitrate_mbps:
    type: float
    default: 15
    min: 0.5
    max: 100
    label: "eMBB — нагрузка DL, Мбит/с"
  hold_s:
    type: int
    default: 120
    min: 10
    max: 1800
    label: "Длительность прогона со срезами, с"

steps:
  - type: component_start
    component: gnuradio
    params: {n: "{{n_ue}}"}
  - type: wait_ready
    component: gnuradio
    timeout_s: 40

  - type: component_start
    component: gnb
  - type: wait_ready
    component: gnb
    timeout_s: 30

  - type: component_start
    component: ue
    params: {n: "{{n_ue}}"}
  - type: wait_ready
    component: ue
    n: "{{n_ue}}"
    timeout_s: 40
    timeout_s_per_ue: 20

  - type: component_start
    component: bridge

  - type: apply_slice_profile
    profile:
      - {slice: eMBB, prb_pct: "{{embb_prb_pct}}"}
      - {slice: URLLC, prb_pct: "{{urllc_prb_pct}}"}
      - {slice: mMTC, prb_pct: "{{mmtc_prb_pct}}"}

  - type: snapshot_metrics
    label: "slices applied"

  - type: load_dl
    n: "{{n_ue}}"
    bitrate_mbps: "{{embb_bitrate_mbps}}"
    duration_s: "{{hold_s}}"

  - type: snapshot_metrics
    label: "end of run"

  - type: component_stop
    component: bridge
  - type: component_stop
    component: ue
  - type: component_stop
    component: gnb
  - type: component_stop
    component: gnuradio
